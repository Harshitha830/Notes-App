<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Notes Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 Smart Notes Manager</h1>
            <div class="header-controls">
                <input type="text" id="searchBar" placeholder="🔍 Search notes..." oninput="searchNotes()">
                <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
                <button class="btn-primary" onclick="openModal()">+ Add Note</button>
            </div>
        </header>

        <div class="dashboard">
            <div class="stat-card">
                <span class="stat-value" id="totalNotes">0</span>
                <span class="stat-label">Total Notes</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="highPriority">0</span>
                <span class="stat-label">High Priority</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="pinnedNotes">0</span>
                <span class="stat-label">Pinned</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="academicNotes">0</span>
                <span class="stat-label">Academic</span>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" onclick="filterNotes('all')">All</button>
            <button class="filter-btn" onclick="filterNotes('personal')">Personal</button>
            <button class="filter-btn" onclick="filterNotes('academic')">Academic</button>
            <button class="filter-btn" onclick="filterNotes('work')">Work</button>
            <button class="filter-btn" onclick="filterNotes('ideas')">Ideas</button>
            <button class="filter-btn" onclick="filterNotes('high')">High Priority</button>
            <button class="filter-btn" onclick="filterNotes('pinned')">Pinned</button>
        </div>

        <div id="notesContainer" class="notes-grid"></div>
    </div>

    <!-- Modal -->
    <div id="noteModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add New Note</h2>
            <form id="noteForm" onsubmit="saveNote(event)">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="noteTitle" placeholder="Enter note title" required>
                </div>
                <div class="form-group">
                    <label>Description * (min 10 characters)</label>
                    <textarea id="noteDescription" placeholder="Enter note description..." rows="5" required></textarea>
                    <span class="char-count" id="charCount">0 characters</span>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category</label>
                        <select id="noteCategory">
                            <option value="personal">Personal</option>
                            <option value="academic">Academic</option>
                            <option value="work">Work</option>
                            <option value="ideas">Ideas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="notePriority">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Tags (comma separated)</label>
                    <input type="text" id="noteTags" placeholder="e.g., DBMS, Exam, Project">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Note</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
